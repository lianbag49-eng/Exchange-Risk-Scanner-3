name: ERS source snapshot for local verification
on:
  push:
    branches: [codex/ers-live-recovery]
    paths: [.github/workflows/ers-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked ERS source only
        run: git archive --format=zip --output=ers-source.zip HEAD kyc-service android-app scripts .github/workflows render.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ers-source-snapshot
          path: ers-source.zip
          retention-days: 7
