name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/ers-hyperliquid", "codex/ers-ai-kyc", "codex/ers-app-diagnostics", "codex/ers-ai-connection", "codex/ers-account-audit", "codex/ers-cmc-discovery", "codex/ers-prevention-home", "codex/ers-auto-preflight", "codex/ers-official-verification", "codex/ers-cause-hypotheses", "codex/ers-startup-all-exchanges", "codex/ers-live-recovery" ]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
      - "kyc-service/**"
      - "render.yaml"
      - "scripts/*apk_release_guard.py"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine Android release scope
        id: release_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- android-app; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AI review service without real uploads
        working-directory: kyc-service
        run: npm test

      - name: Verify production Docker image actually starts
        run: |
          docker build -t ers-ci-review kyc-service
          docker run --rm -d --name ers-ci-review -p 18080:8080 -e OPENAI_API_KEY=synthetic-never-used -e OPENAI_MODEL=synthetic-never-used -e ERS_REVIEW_TOKEN=synthetic-review-token-with-more-than-32-characters ers-ci-review
          trap 'docker logs ers-ci-review; docker stop ers-ci-review >/dev/null || true' EXIT
          # Docker can briefly reset an already-bound port before Node is ready.
          # Retry this local read only; never parse an empty/failed HTTP response.
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 1 --retry-max-time 20 --max-time 2 --output "$RUNNER_TEMP/ers-health.json" http://127.0.0.1:18080/healthz
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ers-health.json','utf8'));if(r.status!=='ready')process.exit(1);console.log('Packaged ERS server health: ready')"

      - name: Test release compatibility guard
        run: python -m unittest discover -s scripts -p test_apk_release_guard.py -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify in-place APK update eligibility
        id: apk_compat
        run: python scripts/apk_release_guard.py

      - name: Upload update compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERS-update-compatibility
          path: apk-update-compatibility.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify screens and offline logos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash android-app/scripts/verify-ui.sh

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERS-screen-tests
          path: |
            android-app/screenshots
            android-app/app/build/reports/androidTests
            android-app/app/build/reports/tests

      - name: Show synthetic diagnostic screen for review
        if: always()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('android-app/app/build/outputs/androidTest-results').rglob('*.xml'):
              for failure in ET.parse(p).iter('failure'):
                  print('ERS_TEST_FAILURE:'+failure.attrib.get('message',''))
                  print((failure.text or '')[:8000])
          PYCODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exchange-Risk-Scanner-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        if: github.ref == 'refs/heads/main' && steps.release_scope.outputs.publish == 'true' && steps.apk_compat.outputs.compatible == 'true'
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Exchange-Risk-Scanner.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Exchange-Risk-Scanner.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "Publish latest APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
