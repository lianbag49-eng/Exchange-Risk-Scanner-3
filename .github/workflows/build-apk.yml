name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/ers-hyperliquid", "codex/ers-ai-kyc", "codex/ers-app-diagnostics", "codex/ers-ai-connection", "codex/ers-account-audit" ]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
      - "kyc-service/**"
      - "render.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AI review service without real uploads
        working-directory: kyc-service
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify screens and offline logos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash android-app/scripts/verify-ui.sh

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERS-screen-tests
          path: |
            android-app/screenshots
            android-app/app/build/reports/androidTests
            android-app/app/build/reports/tests

      - name: Show synthetic diagnostic screen for review
        if: always()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          for name in ['app-diagnostic-start','app-diagnostic-captured','ai-connection','capture-test-failure']:
              p=Path('android-app/screenshots/'+name+'.png')
              if p.exists():
                  print('ERS_PREVIEW_'+name+':'+base64.b64encode(p.read_bytes()).decode())
          for p in Path('android-app/app/build/outputs/androidTest-results').rglob('*.xml'):
              import xml.etree.ElementTree as ET
              for failure in ET.parse(p).iter('failure'):
                  print('ERS_TEST_FAILURE:'+failure.attrib.get('message',''))
                  print((failure.text or '')[:5000])
          PYCODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exchange-Risk-Scanner-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Exchange-Risk-Scanner.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Exchange-Risk-Scanner.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "Publish latest APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
