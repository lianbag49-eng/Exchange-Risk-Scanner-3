name: ERS live startup verification
on:
  workflow_dispatch:
  push:
    branches: [codex/ers-live-recovery]
    paths:
      - scripts/ers-live-smoke.mjs
      - .github/workflows/ers-live-check.yml
      - kyc-service/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing isolated service tests
        working-directory: kyc-service
        run: npm test
      - name: Synthetic-only production startup and AI verification
        run: node scripts/ers-live-smoke.mjs
      - name: Upload bounded verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ers-live-startup-report
          path: ers-live-report.json
          if-no-files-found: ignore
          retention-days: 7
