name: Validate and Deploy BELTRIX Testnet
on:
  push:
    branches: [main, codex/ers-hyperliquid]
    paths: ['qorvexa-dex/**','.github/workflows/deploy-qorvexa.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: beltrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qorvexa-dex/package-lock.json
      - name: Install locked dependencies
        working-directory: qorvexa-dex
        run: npm ci
      - name: Build and validate JavaScript
        working-directory: qorvexa-dex
        run: npm run check && npm run build
      - name: Install Chromium
        working-directory: qorvexa-dex
        run: npx playwright install --with-deps chromium
      - name: Test trading guards and UI
        working-directory: qorvexa-dex
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beltrix-test-results
          path: qorvexa-dex/test-results/
      - name: Prepare web-only artifact
        run: |
          mkdir -p public/qorvexa-dex
          cp -R qorvexa-dex/dist/. public/qorvexa-dex/
      - uses: actions/upload-artifact@v4
        with:
          name: beltrix-web-build
          path: public/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
