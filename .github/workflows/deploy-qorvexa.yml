name: Deploy BELTRIX Testnet
on:
  push:
    branches: [main, codex/beltrix-wallet]
    paths: ['qorvexa-dex/**','.github/workflows/deploy-qorvexa.yml','package.json','package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qorvexa-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}qorvexa-dex/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: npm ci
      - name: Validate wallet transaction logic
        run: npm run test:unit
      - name: Bundle wallet and testnet clients
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate JavaScript
        run: node --check qorvexa-dex/app.js
      - name: Test prototype
        run: npx playwright test --config=qorvexa-dex/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qorvexa-test-results
          path: test-results/
      - name: Emit compact UI previews
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io
          for p in Path("test-results").glob("wallet-*.png"):
            im=Image.open(p).convert("RGB");im.thumbnail((1100,1500));b=io.BytesIO();im.save(b,format="JPEG",quality=72)
            print("WALLET_UI_"+p.stem+":"+base64.b64encode(b.getvalue()).decode())
          PY
      - name: Prepare web-only artifact
        run: |
          mkdir -p public/qorvexa-dex
          cp qorvexa-dex/index.html qorvexa-dex/app.js qorvexa-dex/market.js qorvexa-dex/trading.bundle.js qorvexa-dex/wallet.bundle.js qorvexa-dex/wallet.css qorvexa-dex/sw.js qorvexa-dex/icon.svg qorvexa-dex/manifest.webmanifest public/qorvexa-dex/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
