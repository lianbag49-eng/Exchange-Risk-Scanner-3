name: Deploy BELTRIX Testnet
on:
  push:
    branches: [main]
    paths: ['qorvexa-dex/**','.github/workflows/deploy-qorvexa.yml','package.json','package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qorvexa-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}qorvexa-dex/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: npm ci
      - name: Bundle testnet client
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate JavaScript
        run: node --check qorvexa-dex/app.js
      - name: Test prototype
        run: npx playwright test --config=qorvexa-dex/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qorvexa-test-results
          path: test-results/
      - name: Prepare web-only artifact
        run: |
          mkdir -p public/qorvexa-dex
          cp qorvexa-dex/index.html qorvexa-dex/app.js qorvexa-dex/market.js qorvexa-dex/wallet.js qorvexa-dex/trading.bundle.js qorvexa-dex/sw.js qorvexa-dex/icon.svg qorvexa-dex/manifest.webmanifest public/qorvexa-dex/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
